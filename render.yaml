# Render Blueprint – deploy the full stack with one click
# https://render.com/docs/blueprint-spec

databases:
  - name: iia-event-db
    databaseName: iia_event
    user: iia_user

services:
  # ── Backend API (Node.js) ──────────────────────────────
  - type: web
    name: iia-event-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run db:init
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iia-event-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: https://iia-event-client.onrender.com
      - key: EVENT_NAME
        value: IIA Annual Industrial Meet 2026
      - key: EVENT_PREFIX
        value: IIA2026
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"

  # ── Frontend (Vite / React static site) ────────────────
  - type: web
    name: iia-event-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://iia-event-api.onrender.com/api
